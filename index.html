<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mocha/8.4.0/mocha.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css">
    <link href="https://cdn.jsdelivr.net/npm/vuetify@2.6.3/dist/vuetify.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>  
    <link rel="stylesheet" href="https://wbsckt3.github.io/mocha_test_cases_styles_2/style.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@2.6.3/dist/vuetify.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuex@3.6.2/dist/vuex.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mocha/8.4.0/mocha.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chai/4.3.4/chai.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/javascript/javascript.min.js"></script>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jwt-decode@4.0.0/build/cjs/index.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/seti.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/dracula.min.css">
    <script src="token_functions.js"></script>
</head>
<body>
    <div id="editor-container">
        <textarea id="code-editor"></textarea>
        <button id="run-button">Run</button>
    </div>
    <div id="app-container">
        <div id="app">
	    <h5><button id="ai-assistance">Get AI assistance</button> <span id="remaining-requests"></span> </h5>
	    <h5 id="h5_title"></h5>
	    <div id="challenge"></div>
            <p id="modify-message"></p>
	    <button id="send-response-button" onClick= "guardarResultados()">Send Response</button>
        </div>
	<!-- Footer -->
        <footer id="app-footer">
           © 2025 RefactorII AI Tutor
        </footer>
    </div>
    <div id="console-container"><div id="console"></div></div>
    <div id="mocha-container"><div id="mocha"></div></div>
    <script>mocha.setup('bdd');</script>

    <!-- Modal -->
    <div class="modal fade" id="errorMessageModal" tabindex="-1" role="dialog" aria-labelledby="errorMessageModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="errorMessageModalLabel">Concept</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body" id="errorMessageModalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
  
<script>

 let editor; // Variable global para CodeMirror
// Configuración del editor CodeMirror
editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
    lineNumbers: true,
    mode: 'javascript',
    lineWrapping: true,
    theme: 'seti',
    scrollbarStyle: 'null'
});

let exercises = [];
let currentExerciseIndex = 0;

async function loadExercise(exercise) {
    if (!exercise || typeof exercise !== "object") {
        console.error("No se proporcionó un ejercicio válido.");
        return;
    }
    document.getElementById("h5_title").innerText = exercise.title;
    document.getElementById("challenge").innerText = exercise.description;
    editor.setValue(exercise.codeKoToRefactor);
    window.modal_click_message = exercise.modalClickMessage;
    window.error_message = exercise.errorMessage;
    window.success_message = exercise.successMessage;
    const codeOkForExpect = exercise.codeOkForExpect;
	console.log(codeOkForExpect)
    try {
        await fetchAIResponseGetAiExpect(codeOkForExpect);
    } catch (error) {
        console.error("Error al obtener expectativas de IA:", error);
    }
}


async function loadExercises(exerciseId) {
    try {
        const response = await fetch('exercises.json');
        const exercises = await response.json();
        const selectedExercise = exercises.find(ex => String(ex.id) === String(exerciseId));
        if (selectedExercise) {
            console.log("Ejercicio encontrado:", selectedExercise);
            loadExercise(selectedExercise);
        } else {
            console.error("❌ Ejercicio no encontrado en el JSON.");
        }
    } catch (error) {
        console.error("⚠️ Error al cargar los ejercicios:", error);
    }
}

function test_cases_scenario() {
    document.getElementById('modify-message').addEventListener('click', function () {
        $('#errorMessageModalBody').html(error_message);
        $('#errorMessageModal').modal('show');
    });

    function logToConsole(message, color) {
        const consoleElement = document.getElementById('console');
        const messageElement = document.createElement('div');
        messageElement.textContent = message;
        if (color) {
            messageElement.style.color = color;
            messageElement.style.fontWeight = 'bold';
        }
        consoleElement.appendChild(messageElement);
    }

    document.getElementById('run-button').addEventListener('click', function() {
        document.getElementById('console').innerHTML = '';
        document.getElementById('mocha').innerHTML = '';
        mocha.suite.suites = [];

        const userCode = editor.getValue();
        const originalConsoleLog = console.log;
        console.log = function(...args) {  console.log("Procesando...");
            originalConsoleLog.apply(console, args);
            logToConsole(args.join(' '));
        };

        setTimeout(() => {
            try {
                new Function(userCode)();
                const expect = chai.expect;

                describe('JavaScript Code Tests', function() {
                    it('should execute without errors', function(done) {
                        try {
                            new Function(userCode)();
                            done();
                        } catch (e) {
                            done(e);
                        }
                    });

                    const expectations = localStorage.getItem('testExpectations') || '';
                    it('should log correct values', function(done) {
                        const output = [];
                        console.log = function (message) {
                            output.push(message);
                            originalConsoleLog.apply(console, arguments);
                        };
                        new Function(userCode)();
                        setTimeout(() => {
                            try {
                                eval(expectations);
                                done();
                            } catch (err) {
                                done(err);
                            }
                        }, 10);
                    });
                });

                let allTestsPassed = true;
                mocha.setup({ ui: 'bdd', cleanReferencesAfterRun: false });
                mocha.run()
                    .on('fail', function(test, err) {
                        logToConsole(`• Test failed: ${test.title} - ${err.message}`);
                        document.getElementById('run-button').innerText = 'Reintentar';
                        document.getElementById('run-button').style.backgroundColor = '#ff0000ad';
                        document.getElementById('run-button').onclick = function() {
                            window.location.reload();
                        };
                        allTestsPassed = false;
                    })
                    .on('end', function() {
                        logToConsole('• All tests finished!');
                        if (allTestsPassed) {
                            document.getElementById('send-response-button').classList.add('enabled');
                        }
                    });
            } catch (e) {
                console.error('Error evaluating user code:', e);
                logToConsole('Error: ' + e.message, 'red');
            } finally {
                console.log = originalConsoleLog;
            }
        }, 3000);
    });
}

test_cases_scenario();

document.addEventListener("DOMContentLoaded", function () {
    const urlParams = new URLSearchParams(window.location.search);
    const exerciseId = urlParams.get("exercise");
    if (exerciseId) {
        loadExercises(exerciseId);
    } else {
        console.error("No se proporcionó un ID de ejercicio en la URL.");
    }
});

async function fetchAIResponseGetAiExpect(userCode) {
    try {
        const challenge = document.getElementById('challenge').textContent;
        const response = await fetch('https://www.refactorii.com/fetchAIExpectations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: userCode, challenge: challenge })
        });
        const data = await response.json();
        if (data.success) {
            localStorage.setItem('testExpectations', data.expectations);
        } else {
            console.error("Error en la respuesta de la IA:", data.message);
        }
    } catch (error) {
        console.error("Error al obtener expectativas de IA:", error);
    }
}       
        
</script>

</body>
</html>
