<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mocha/8.4.0/mocha.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css">
    <link href="https://cdn.jsdelivr.net/npm/vuetify@2.6.3/dist/vuetify.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>  
    <link rel="stylesheet" href="https://wbsckt3.github.io/mocha_test_cases_styles_2/style.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@2.6.3/dist/vuetify.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuex@3.6.2/dist/vuex.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mocha/8.4.0/mocha.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chai/4.3.4/chai.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/javascript/javascript.min.js"></script>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jwt-decode@4.0.0/build/cjs/index.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/seti.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/dracula.min.css">
    <script src="guardar_resultados.js"></script>
</head>
<body>
    <div id="editor-container">
        <textarea id="code-editor"></textarea>
        <button id="run-button">Run</button>
    </div>
    <div id="app-container">
        <div id="app">
	    <h5><button id="ai-assistance">Obtener asistencia IA</button> <span id="remaining-requests"></span> </h5>
	    <h5 id="h5_title"></h5>
	    <div id="challenge"></div>
            <p id="modify-message"></p>
	    <button id="send-response-button" onClick= "guardarResultados()">Guardar resultados</button>
        </div>
	<!-- Footer -->
        <footer id="app-footer">
           © 2025 RefactorII AI Tutor
        </footer>
    </div>
    <div id="console-container"><div id="console"></div></div>
    <div id="mocha-container"><div id="mocha"></div></div>
    <script>mocha.setup('bdd');</script>

    <!-- Modal -->
    <div class="modal fade" id="errorMessageModal" tabindex="-1" role="dialog" aria-labelledby="errorMessageModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="errorMessageModalLabel">Concept</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body" id="errorMessageModalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
  
<script>
let editor;

// Configuración de CodeMirror para ser agnóstico al lenguaje
editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
    lineNumbers: true,
    mode: 'text/x-java', // Se configura como Java para sintaxis
    lineWrapping: true,
    theme: 'seti',
    scrollbarStyle: 'null'
});

let exercises = [];
let currentExerciseIndex = 0;

function printToConsole(message) {
    const consoleDiv = document.getElementById("console");
    consoleDiv.innerHTML += `<p>${message}</p>`;
}

function simulateCompilation() {
    document.getElementById("console").innerHTML = "<p>Compilando...</p>";
    setTimeout(async () => {
        const userCode = editor.getValue();
        const storedExpectations = localStorage.getItem('testExpectations');
        
        if (!storedExpectations) {
            printToConsole("Error: No se encontraron expectativas guardadas.");
            return;
        }

        try {
            const expectations = JSON.parse(storedExpectations);
            const expectedOutput = expectations.expectedConsoleOutput;
            
            if (userCode.trim() === expectations.codeOkForExpect.trim()) {
                printToConsole(expectedOutput || "Ejecutado correctamente");
                document.getElementById("send-response-button").style.display = "block";
            } else {
                printToConsole("Error: El código no es correcto.");
                document.getElementById("send-response-button").style.display = "none";
            }
        } catch (error) {
            printToConsole("Error al interpretar expectativas.");
            console.error("Error al analizar expectativas:", error);
        }
    }, 1000);
}

async function loadExercise(exercise) {
    try {
        if (!exercise || typeof exercise !== "object") {
            throw new Error("Objeto exercise no válido o undefined");
        }

        const requiredProps = ['title', 'description', 'codeKoToRefactor', 'codeOkForExpect'];
        const missingProps = requiredProps.filter(prop => !(prop in exercise));
        
        if (missingProps.length > 0) {
            throw new Error(`Ejercicio corrupto. Faltan propiedades: ${missingProps.join(', ')}`);
        }

        document.getElementById("h5_title").innerText = exercise.title;
        document.getElementById("challenge").innerText = exercise.description;
        editor.setValue(exercise.codeKoToRefactor);

        window.success_message = exercise.successMessage || "¡Éxito!";

        console.log("Código para generar expectativas:", exercise.codeOkForExpect);
        await fetchAIResponseGetAiExpect(exercise.codeOkForExpect);
    } catch (error) {
        console.error("Error crítico en loadExercise:", error);
        localStorage.removeItem('testExpectations');
        throw error;
    }
}

async function fetchAIResponseGetAiExpect(userCode) {
    try {
        if (typeof userCode !== "string" || userCode.trim() === "") {
            throw new Error(`Código inválido: ${typeof userCode}`);
        }

        const response = await fetch('https://www.refactorii.com/fetchAIExpectations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                code: userCode,
                language: "java",
                timestamp: new Date().toISOString()
            })
        });

        if (!response.ok) {
            throw new Error(`Error HTTP! estado: ${response.status}`);
        }

        const data = await response.json();
        if (!data.success || !data.expectations) {
            throw new Error(data.message || "Respuesta del servidor inválida");
        }

        localStorage.setItem('testExpectations', JSON.stringify(data.expectations));
        console.log("Expectativas almacenadas:", data.expectations);
    } catch (error) {
        console.error("Error en fetchAIResponseGetAiExpect:", error);
        localStorage.removeItem('testExpectations');
        throw error;
    }
}

async function loadExercises(exerciseId) {
    try {
        const response = await fetch('exercises.json');
        if (!response.ok) throw new Error(`Error al cargar JSON: ${response.status}`);
        
        const exercises = await response.json();
        const selectedExercise = exercises.find(ex => String(ex.id) === String(exerciseId));
        
        if (!selectedExercise) {
            throw new Error(`Ejercicio con ID ${exerciseId} no encontrado`);
        }

        // Validar estructura del ejercicio seleccionado
        if (!selectedExercise.codeOkForExpect) {
            throw new Error("El ejercicio no tiene codeOkForExpect");
        }

        console.log("Ejercicio cargado:", selectedExercise);
        await loadExercise(selectedExercise);

    } catch (error) {
        console.error("Error crítico en loadExercises:", error);
        localStorage.removeItem('testExpectations');
        throw error;
    }
}

document.addEventListener("DOMContentLoaded", async function () {
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token'); 

    async function validateAndProcessToken() {
        if (!token) {
            document.body.innerHTML = 'Access denied. No token provided.';
            return;
        }

        const response = await fetch(`https://www.refactorii.com/validate-token?token=${token}`);
        const data = await response.json();

        if (!data.valid) {
            console.log("Token inválido");
            document.body.innerHTML = 'Access denied. Invalid token.';
            return;
        }

        console.log("Token válido:", data);
        const exerciseId = urlParams.get("exercise");
        if (exerciseId) {
           loadExercises(exerciseId);
        } else {
            console.error("No se proporcionó un ID de ejercicio en la URL.");
        }
    }

    validateAndProcessToken();
});

</script>

</body>
</html>
