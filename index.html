async function loadExercise(exercise) {
    try {
        // Validación robusta del objeto exercise
        if (!exercise || typeof exercise !== "object") {
            throw new Error("Objeto exercise no válido o undefined");
        }

        const requiredProps = ['title', 'description', 'codeKoToRefactor', 'codeOkForExpect'];
        const missingProps = requiredProps.filter(prop => !(prop in exercise));
        
        if (missingProps.length > 0) {
            throw new Error(`Ejercicio corrupto. Faltan propiedades: ${missingProps.join(', ')}`);
        }

        // Setear valores en la UI
        document.getElementById("h5_title").innerText = exercise.title;
        document.getElementById("challenge").innerText = exercise.description;
        editor.setValue(exercise.codeKoToRefactor);
        
        // Setear mensajes
        window.modal_click_message = exercise.modalClickMessage || "Mensaje predeterminado";
        window.error_message = exercise.errorMessage || "Error predeterminado";
        window.success_message = exercise.successMessage || "¡Éxito!";

        // Validar y procesar codeOkForExpect
        if (typeof exercise.codeOkForExpect !== "string" || exercise.codeOkForExpect.trim() === "") {
            throw new Error("codeOkForExpect no es un código válido");
        }
        
        console.log("Código para generar expectativas:", exercise.codeOkForExpect);
        await fetchAIResponseGetAiExpect(exercise.codeOkForExpect);

    } catch (error) {
        console.error("Error crítico en loadExercise:", error);
        localStorage.removeItem('testExpectations');
        throw error;
    }
}

async function fetchAIResponseGetAiExpect(userCode) {
    try {
        // Validación estricta del input
        if (typeof userCode !== "string" || userCode.trim() === "") {
            throw new Error(`Código inválido: ${typeof userCode}`);
        }

        const challenge = document.getElementById('challenge').textContent;
        
        // Codificar para prevenir errores con caracteres especiales
        const encodedCode = encodeURIComponent(userCode);
        const encodedChallenge = encodeURIComponent(challenge);

        // Debug: Verificar datos enviados
        console.log("Enviando al backend:", {
            code: userCode,
            challenge: challenge
        });

        const response = await fetch('https://www.refactorii.com/fetchAIExpectations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                code: encodedCode,
                challenge: encodedChallenge,
                timestamp: new Date().toISOString()
            })
        });

        if (!response.ok) {
            throw new Error(`Error HTTP! estado: ${response.status}`);
        }

        const data = await response.json();
        console.log("Respuesta del backend:", data);

        if (!data.success || !data.expectations) {
            throw new Error(data.message || "Respuesta del servidor inválida");
        }

        // Validar formato de las expectativas
        const expectationRegex = /expect\(output\[\d+\]\)\.to\.equal\(.+?\);/g;
        if (!expectationRegex.test(data.expectations)) {
            throw new Error("Formato de expectativas inválido");
        }

        localStorage.setItem('testExpectations', data.expectations);
        console.log("Expectativas almacenadas:", data.expectations);

	/*const urlParams = new URLSearchParams(window.location.search);

        if (exerciseId) {

        } else {
          console.error("No se proporcionó un ID de ejercicio en la URL.");
        }*/

    } catch (error) {
        console.error("Error en fetchAIResponseGetAiExpect:", error);
        localStorage.removeItem('testExpectations');
        throw error;
    }
}

async function loadExercises(exerciseId) {
    try {
        const response = await fetch('exercises.json');
        if (!response.ok) throw new Error(`Error al cargar JSON: ${response.status}`);
        
        const exercises = await response.json();
        const selectedExercise = exercises.find(ex => String(ex.id) === String(exerciseId));
        
        if (!selectedExercise) {
            throw new Error(`Ejercicio con ID ${exerciseId} no encontrado`);
        }

        // Validar estructura del ejercicio seleccionado
        if (!selectedExercise.codeOkForExpect) {
            throw new Error("El ejercicio no tiene codeOkForExpect");
        }

        console.log("Ejercicio cargado:", selectedExercise);
        await loadExercise(selectedExercise);

    } catch (error) {
        console.error("Error crítico en loadExercises:", error);
        localStorage.removeItem('testExpectations');
        throw error;
    }
}
	
function test_cases_scenario() {
    document.getElementById('modify-message').addEventListener('click', function () {
        $('#errorMessageModalBody').html(error_message);
        $('#errorMessageModal').modal('show');
    });

    function logToConsole(message, color) {
        const consoleElement = document.getElementById('console');
        const messageElement = document.createElement('div');
        messageElement.textContent = message;
        if (color) {
            messageElement.style.color = color;
            messageElement.style.fontWeight = 'bold';
        }
        consoleElement.appendChild(messageElement);
    }

    document.getElementById('run-button').addEventListener('click', function() {
        document.getElementById('console').innerHTML = '';
        document.getElementById('mocha').innerHTML = '';
        mocha.suite.suites = [];

        const userCode = editor.getValue();
        const originalConsoleLog = console.log;

        // Redefinir console.log solo una vez
        console.log = function(...args) {
            originalConsoleLog.apply(console, args); // Llama a la función original
            logToConsole(args.join(' ')); // Registra en la consola personalizada
        };

        setTimeout(() => {
            try {
                new Function(userCode)();
                const expect = chai.expect;

                describe('JavaScript Code Tests', function() {
                    it('should execute without errors', function(done) {
                        try {
                            new Function(userCode)();
                            done();
                        } catch (e) {
                            done(e);
                        }
                    });

                    const expectations = localStorage.getItem('testExpectations') || '';
                    it('should log correct values', function(done) {
                        const output = [];
                        const originalConsoleLog = console.log; // Guardar la referencia original

                        // Redefinir console.log para capturar los mensajes
                        console.log = function (message) {
                            output.push(message);
                            originalConsoleLog.apply(console, arguments); // Llama a la función original
                        };

                        new Function(userCode)();

                        setTimeout(() => {
                            try {
                                eval(expectations);
                                done();
                            } catch (err) {
                                done(err);
                            }
                        }, 10);
                    });
                });

                let allTestsPassed = true;
                mocha.setup({ ui: 'bdd', cleanReferencesAfterRun: false });
                mocha.run()
                    .on('fail', function(test, err) {
                        logToConsole(`• Test failed: ${test.title} - ${err.message}`);
                        document.getElementById('run-button').innerText = 'Reintentar';
                        document.getElementById('run-button').style.backgroundColor = '#ff0000ad';
                        document.getElementById('run-button').onclick = function() {
                            window.location.reload();
                        };
                        allTestsPassed = false;
                    })
                    .on('end', function() {
                        logToConsole('• All tests finished!');
                        if (allTestsPassed) {
                            document.getElementById('send-response-button').classList.add('enabled');
                        }
                    });
            } catch (e) {
                console.error('Error evaluating user code:', e);
                logToConsole('Error: ' + e.message, 'red');
            } finally {
                console.log = originalConsoleLog; // Restaurar console.log original
            }
        }, 3000);
    });
}

test_cases_scenario();

  async function validateAndProcessToken() {
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
        document.body.innerHTML = 'Access denied. No token provided.';
        return;
    }

        const response = await fetch(`https://www.refactorii.com/validate-token?token=${token}`);
        const data = await response.json();

        if (!data.valid) {
            console.log("Token inválido");
            document.body.innerHTML = 'Access denied. Invalid token.';
            return;
        }

        console.log("Token válido:", data);

        // Decodificar el token para obtener el payload
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(c =>
            '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
        ).join(''));

        const decodedToken = JSON.parse(jsonPayload);
        const recipeId = decodedToken._id; // Asegúrate de usar el nombre correcto del campo en el payload
        const email = decodedToken.email;

        console.log('Recipe ID:', recipeId);

        // Almacenar en localStorage
        localStorage.setItem('recipeId', recipeId);
        localStorage.setItem('email', email);

        // Llamar a la función después de validar el token y almacenar los datos
        loadMarkdownFiles();


}
