<script>
let editor;

// Configuración de CodeMirror para ser agnóstico al lenguaje
editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
    lineNumbers: true,
    mode: 'javascript', // Se configura como Java para sintaxis
    lineWrapping: true,
    theme: 'seti',
    scrollbarStyle: 'null'
});

let currentExercise;
let failCount = 0; // Contador de fallos consecutivos

function printToConsole(message) {
    const consoleDiv = document.getElementById("console");
    consoleDiv.innerHTML += `<p>${message}</p>`;
}

async function simulateCompilation() {
    document.getElementById("console").innerHTML = "<p>Compilando...</p>";
    setTimeout(() => {
        const userCode = editor.getValue();

        if (!currentExercise) {
            printToConsole("Error: No se ha cargado un ejercicio.");
            return;
        }

        try {
            // ✅ VALIDACIÓN LOCAL: Comparar con codeOkForExpect almacenado en localStorage
            const correctCode = currentExercise.codeOkForExpect;
            const expectedOutput = currentExercise.expectedConsoleOutput;
            const errorSimulation = currentExercise.errorSimulation;

            // Normalizar el código para comparación (eliminar espacios extra, saltos de línea)
            const normalizeCode = (code) => {
                return code.replace(/\s+/g, ' ').trim();
            };

            const userCodeNormalized = normalizeCode(userCode);
            const correctCodeNormalized = normalizeCode(correctCode);

            // Simular la ejecución del código
            printToConsole(`<b>Salida esperada:</b> ${expectedOutput}`);
            
            // Verificar si el código es correcto
            const isCorrect = userCodeNormalized === correctCodeNormalized;

            if (isCorrect) {
                // ✅ Código correcto
                printToConsole(`<b>Salida obtenida:</b> ${expectedOutput}`);
                printToConsole(`<b style="color:green;">${currentExercise.successMessage}</b>`);
                document.getElementById("send-response-button").style.display = "block";
                document.getElementById("send-response-button").disabled = false;    
                document.getElementById("retry-button").style.display = "none";
                document.getElementById("run-button").style.display = "none";
                failCount = 0;
            } else {
                // ❌ Código incorrecto
                printToConsole(`<b>Salida obtenida:</b> ${errorSimulation}`);
                printToConsole(`<b style="color:red;">Errores encontrados:</b>`);
                
                // Análisis de diferencias básico
                const differences = analyzeCodeDifferences(userCode, correctCode);
                if (differences.length > 0) {
                    const messages = differences.map(diff => `<b>${diff.type}:</b> ${diff.message}`).join("<br>");
                    printToConsole(messages);
                } else {
                    printToConsole("El código no coincide con la solución esperada. Revisa la sintaxis y la lógica.");
                }
                
                document.getElementById("run-button").style.display = "none";
                document.getElementById("send-response-button").style.display = "none";
                document.getElementById("retry-button").style.display = "block";
                failCount++;
            }
        } catch (error) {
            console.error("Error en simulateCompilation:", error);
            printToConsole("Error en la validación del código.");
            document.getElementById("retry-button").style.display = "block";
        }
    }, 1000);
}

// ✅ Función para analizar diferencias entre códigos
function analyzeCodeDifferences(userCode, correctCode) {
    const differences = [];
    
    // Verificar diferencias básicas
    if (!userCode.includes('int[]') && correctCode.includes('int[]')) {
        differences.push({
            type: "Sintaxis",
            message: "Usa la sintaxis recomendada: int[] en lugar de int array[]"
        });
    }
    
    if (userCode.includes('int array[]') && correctCode.includes('int[]')) {
        differences.push({
            type: "Sintaxis", 
            message: "La declaración del array debe ser: int[] nombreArray"
        });
    }
    
    // Verificar si faltan elementos esenciales
    const userLines = userCode.split('\n').map(line => line.trim()).filter(line => line);
    const correctLines = correctCode.split('\n').map(line => line.trim()).filter(line => line);
    
    if (userLines.length !== correctLines.length) {
        differences.push({
            type: "Estructura",
            message: `Número de líneas incorrecto. Esperado: ${correctLines.length}, encontrado: ${userLines.length}`
        });
    }
    
    return differences;
}



function resetEditor() {
    editor.setValue(currentExercise.codeKoToRefactor);
    document.getElementById("console").innerHTML = "";
    document.getElementById("retry-button").style.display = "none";
    document.getElementById("run-button").style.display = "block";
    failCount = 0;
}

async function loadExercise(exercise) {
    try {
        if (!exercise || typeof exercise !== "object") {
            throw new Error("Objeto exercise no válido o undefined");
        }

        const requiredProps = ['title', 'description', 'codeKoToRefactor', 'codeOkForExpect', 'expectedConsoleOutput', 'language'];
        const missingProps = requiredProps.filter(prop => !(prop in exercise));
        
        if (missingProps.length > 0) {
            throw new Error(`Ejercicio corrupto. Faltan propiedades: ${missingProps.join(', ')}`);
        }
        document.getElementById("h4_language").innerText = exercise.language;
        document.getElementById("h5_title").innerText = exercise.title;
        document.getElementById("challenge").innerText = exercise.description;
	document.getElementById("modify-message").innerText = exercise.concept;
        editor.setValue(exercise.codeKoToRefactor);

        window.success_message = exercise.successMessage || "¡Éxito!";
        currentExercise = exercise;
    } catch (error) {
        console.error("Error crítico en loadExercise:", error);
        throw error;
    }
}
