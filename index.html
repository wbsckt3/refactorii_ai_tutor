</head>
<body>
    <div id="editor-container">
        <textarea id="code-editor"></textarea>
	<img id="logo" src="logo_refactorii.png" alt="Refactorii AI Tutor">
        <button id="run-button">Run</button>
    </div>
    <div id="app-container">
        <div id="app">
	    <h5><button id="ai-assistance">Get AI assistance</button> <span id="remaining-requests"></span> </h5>
	    <h5 id="h5_title"></h5>
	    <div id="challenge"></div>
            <p id="modify-message"></p>
	    <button id="send-response-button" onClick= "guardarResultados()">Send Response</button>
        </div>
    </div>
    <div id="console-container"><div id="console"></div></div>
    <div id="mocha-container"><div id="mocha"></div></div>
    <script>mocha.setup('bdd');</script>

    <!-- Modal -->
    <div class="modal fade" id="errorMessageModal" tabindex="-1" role="dialog" aria-labelledby="errorMessageModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="errorMessageModalLabel">Concept</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body" id="errorMessageModalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
    <script>
	document.addEventListener("DOMContentLoaded", function() {
	    const urlParams = new URLSearchParams(window.location.search);
	    const script1 = urlParams.get('script1');
	    const script2 = urlParams.get('script2');
	    const script3 = urlParams.get('script3');
	    function loadScript(scriptUrl) {
	        return new Promise((resolve, reject) => {
	            if (scriptUrl) {
	                const scriptElement = document.createElement('script');
	                scriptElement.src = scriptUrl;
	                scriptElement.type = 'text/javascript';
	                scriptElement.defer = true;
	                scriptElement.onload = resolve;
	                scriptElement.onerror = reject;
	                document.body.appendChild(scriptElement);
	            } else {
	                reject('No se proporcionó un script en la URL');
	            }
	        });
	    }
	
	    // Cargar script1, luego script2, luego script3
	    loadScript(script1)
	        //.then(() => loadScript(script2))
	        .then(() => loadScript(script3))
	        .catch((error) => console.error('Error al cargar los scripts:', error));
	});

function test_cases_scenario(){
	
        const editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
            lineNumbers: true,
            mode: 'javascript',
            lineWrapping: true,
	    theme: 'dracula', // Aplicar el tema oscuro
            scrollbarStyle: 'null'
        });
        
        // Función para mostrar el modal con el mensaje de error
        document.getElementById('modify-message').addEventListener('click', function() {
            $('#errorMessageModalBody').html(error_message); // Coloca el contenido del error en el cuerpo del modal
            $('#errorMessageModal').modal('show'); // Muestra el modal
        });

        function logToConsole(message, color) {
            const consoleElement = document.getElementById('console');
            const messageElement = document.createElement('div');
            messageElement.textContent = message;
            if (color) {
                messageElement.style.color = color;
                messageElement.style.fontWeight = 'bold';
            }
            consoleElement.appendChild(messageElement);
        }

document.getElementById('run-button').addEventListener('click', function() {
    // Limpiar resultados anteriores
    document.getElementById('console').innerHTML = '';
    document.getElementById('mocha').innerHTML = '';
    mocha.suite.suites = []; // Limpiar casos de prueba anteriores

    // Obtener el código del usuario desde el editor
    const userCode = editor.getValue();

    // Redirigir console.log a la consola personalizada
    const output = [];
    const originalConsoleLog = console.log;
    logToConsole('Running tests....', '#67e810');
    console.log = function(...args) {
        const message = args.join(' ');
        originalConsoleLog.apply(console, args); // Seguir registrando en la consola original
        logToConsole(message);
    };

    setTimeout(() => {
        try {
            // Evaluar el código del usuario en el ámbito global
            eval(userCode);

            // Verificar que el objeto shape esté definido
            if (typeof shape === 'undefined') {
                throw new Error('El objeto "shape" no está definido.');
            }

            // Definir casos de prueba
            const expect = chai.expect;

            describe('JavaScript Code Tests', function() {
                // Verifica que el objeto shape esté definido
                it('should have the shape object defined', function() {
                    expect(shape).to.exist;
                    expect(shape).to.be.an('object');
                });

                // Verifica que el método out1 retorne el nombre correcto
                it('should return the correct name using out1', function() {
                    expect(shape.out1()).to.equal('Refactorii');
                });

                // Verifica que el método out2 retorne la edad correcta
                it('should return the correct age using out2', function() {
                    expect(shape.out2()).to.equal(21);
                });

                // Verifica que el objeto shape tenga la propiedad name
                it('should have a property named "name"', function() {
                    expect(shape).to.have.property('name');
                    expect(shape.name).to.equal('Refactorii');
                });

                // Verifica que el objeto shape tenga la propiedad age
                it('should have a property named "age"', function() {
                    expect(shape).to.have.property('age');
                    expect(shape.age).to.equal(21);
                });

                // Verifica que los métodos out1 y out2 sean funciones
                it('should have out1 and out2 as functions', function() {
                    expect(shape.out1).to.be.a('function');
                    expect(shape.out2).to.be.a('function');
                });
            });

            // Ejecutar las pruebas de Mocha
            mocha.run()
                .on('test', function(test) {
                    logToConsole('• Running test: ' + test.title);
                })
                .on('test end', function(test) {
                    logToConsole('• Test finished: ' + test.title);
                })
                .on('pass', function(test) {
                    logToConsole('• Test passed: ' + test.title);
                })
                .on('fail', function(test, err) {
                    logToConsole('• Test failed: ' + test.title + ' - ' + err.message);
                    success_message = modal_click_message;
                    const runButton = document.getElementById('run-button');
                    runButton.innerText = 'Reintentar';
                    runButton.style.backgroundColor = '#ff0000ad';
                    runButton.onclick = function() {
                        window.location.reload();
                    };
                    allTestsPassed = false; // Si cualquier test falla, actualizamos la variable
                })
                .on('end', function() {
                    logToConsole('• All tests finished!');
                    document.getElementById('modify-message').innerText = success_message;
                    document.getElementById('modify-message').style.display = 'block';
                    document.getElementById('modify-message').style.color = 'black';
                    if (allTestsPassed) {
                        const sendResponseButton = document.getElementById('send-response-button');
                        sendResponseButton.classList.add('enabled');
                    }
                });

        } catch (e) {
            console.error('Error evaluating user code:', e);
            logToConsole('Error: ' + e.message, 'red');
        } finally {
            // Restaurar console.log original
            console.log = originalConsoleLog;
        }
    }, 3000); // Retardo de 3 segundos
});
		
		
}  			            
test_cases_scenario();
	    
    </script>
</body>
