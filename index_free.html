<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mocha/8.4.0/mocha.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css">
    <link href="https://cdn.jsdelivr.net/npm/vuetify@2.6.3/dist/vuetify.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>  
    <link rel="stylesheet" href="https://wbsckt3.github.io/mocha_test_cases_styles_2/style.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@2.6.3/dist/vuetify.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuex@3.6.2/dist/vuex.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mocha/8.4.0/mocha.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chai/4.3.4/chai.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/javascript/javascript.min.js"></script>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/jwt-decode@4.0.0/build/cjs/index.min.js"></script> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/seti.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/dracula.min.css">
    <script src="guardar_resultados.js"></script>
</head>
<body>
     <header>
        <h1>Refactorii 🚀</h1>
    </header>
    <div id="editor-container">
        <textarea id="code-editor"></textarea>
        <button id="run-button" onclick="simulateCompilation()">Run</button>  
    </div>
    <div id="app-container">
        <div id="app">
	    <h4 id="h4_language" style="padding-bottom: 16px;"></h4>
	    <h5 id="h5_title"></h5>
	    <div id="challenge"></div>	
            <p id="modify-message"></p>
	    <button id="send-response-button" onClick="guardarResultados()" style="display: none;">Guardar resultados</button>
	    <button id="retry-button" onClick="resetEditor()" style="display: none;">Reintentar</button>  
        </div>
	<!-- Footer -->
        <footer id="app-footer">
           © 2025 RefactorII AI Tutor | <a href="https://www.refactorii.com">mas cursos?</a>
        </footer>
    </div>
    <div id="console-container"><div id="console"></div></div>
    <div id="mocha-container"><div id="mocha"></div></div>
    <script>mocha.setup('bdd');</script>

    <!-- Modal -->
    <div class="modal fade" id="errorMessageModal" tabindex="-1" role="dialog" aria-labelledby="errorMessageModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="errorMessageModalLabel">Concept</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body" id="errorMessageModalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
    
<script>
let editor;

// Configuración de CodeMirror para ser agnóstico al lenguaje
editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
    lineNumbers: true,
    mode: 'javascript', // Se configura como Java para sintaxis
    lineWrapping: true,
    theme: 'seti',
    scrollbarStyle: 'null'
});

let currentExercise;
let failCount = 0; // Contador de fallos consecutivos

function printToConsole(message) {
    const consoleDiv = document.getElementById("console");
    consoleDiv.innerHTML += `<p>${message}</p>`;
}

async function simulateCompilation() {
    document.getElementById("console").innerHTML = "<p>Compilando...</p>";
    setTimeout(async () => {
        const userCode = editor.getValue();

        if (!currentExercise) {
            printToConsole("Error: No se ha cargado un ejercicio.");
            return;
        }

        try {
            const response = await fetch('https://www.refactorii.com/fetchAIExpectationsAgnostic', { 
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    code: userCode,
                    challenge: currentExercise, // Se envía el JSON completo del ejercicio
                    language: currentExercise.language,
                    timestamp: new Date().toISOString()
                })
            });

            if (!response.ok) {
                throw new Error(`Error HTTP! estado: ${response.status}`);
            }

            const data = await response.json();
            console.log("Respuesta del backend:", data);
            document.getElementById("modify-message").innerText = data.expectations.feedback;

            if (!data.success) {
                throw new Error(data.message || "Respuesta del servidor inválida");
            }

            // Simulación de ejecución
            printToConsole(`<b>Salida esperada:</b> ${currentExercise.expectedConsoleOutput}`);
            printToConsole(`<b>Salida obtenida:</b> ${data.expectations.output}`);

            // Evaluar si el código es correcto
            const isCorrect = data.expectations.isCorrect;
            const differences = data.expectations.differences || [];

            if (isCorrect) {
                printToConsole(`<b style="color:green;">${currentExercise.successMessage}</b>`);
                document.getElementById("send-response-button").style.display = "block";
		document.getElementById("send-response-button").disabled = false;    
                document.getElementById("retry-button").style.display = "none";
		document.getElementById("run-button").style.display = "none";
                failCount = 0;
            } else {
                let messages = differences.map(diff => `<b>${diff.element}:</b> Esperado "${diff.expected}", encontrado "${diff.actual}".`).join("<br>");
                printToConsole(`<b style="color:red;">Errores encontrados:</b><br>${messages}`);
                document.getElementById("run-button").style.display = "none";
                document.getElementById("send-response-button").style.display = "none";
                document.getElementById("retry-button").style.display = "block";
                failCount++;
            }
        } catch (error) {
            console.error("Error en simulateCompilation:", error);
            printToConsole("Error en la validación del código.");
            document.getElementById("retry-button").style.display = "block";
        }
    }, 1000);
}



function resetEditor() {
    editor.setValue(currentExercise.codeKoToRefactor);
    document.getElementById("console").innerHTML = "";
    document.getElementById("retry-button").style.display = "none";
    document.getElementById("run-button").style.display = "block";
    failCount = 0;
}

async function loadExercise(exercise) {
    try {
        if (!exercise || typeof exercise !== "object") {
            throw new Error("Objeto exercise no válido o undefined");
        }

        const requiredProps = ['title', 'description', 'codeKoToRefactor', 'codeOkForExpect', 'expectedConsoleOutput', 'language'];
        const missingProps = requiredProps.filter(prop => !(prop in exercise));
        
        if (missingProps.length > 0) {
            throw new Error(`Ejercicio corrupto. Faltan propiedades: ${missingProps.join(', ')}`);
        }
        document.getElementById("h4_language").innerText = exercise.language;
        document.getElementById("h5_title").innerText = exercise.title;
        document.getElementById("challenge").innerText = exercise.description;
	document.getElementById("modify-message").innerText = exercise.concept;
        editor.setValue(exercise.codeKoToRefactor);

        window.success_message = exercise.successMessage || "¡Éxito!";
        currentExercise = exercise;
    } catch (error) {
        console.error("Error crítico en loadExercise:", error);
        throw error;
    }
}
	
async function loadExercises(exerciseId, exercises_package) {
    try {
        const response = await fetch(`${exercises_package}.json`);
        if (!response.ok) throw new Error(`Error al cargar JSON: ${response.status}`);
        
        const exercises = await response.json();
        const selectedExercise = exercises.find(ex => String(ex.id) === String(exerciseId));
        
        if (!selectedExercise) {
            throw new Error(`Ejercicio con ID ${exerciseId} no encontrado`);
        }

        // Validar estructura del ejercicio seleccionado
        if (!selectedExercise.codeOkForExpect) {
            throw new Error("El ejercicio no tiene codeOkForExpect");
        }
	    
        await loadExercise(selectedExercise);

    } catch (error) {
        console.error("Error crítico en loadExercises:", error);
        localStorage.removeItem('testExpectations');
        throw error;
    }
}

document.addEventListener("DOMContentLoaded", async function () {
        const urlParams = new URLSearchParams(window.location.search);
        const exerciseId = urlParams.get("exercise");
	const exercises_package = urlParams.get("exercises_package");
        if (exerciseId) {
           loadExercises(exerciseId, exercises_package);
        } else {
            console.error("No se proporcionó un ID de ejercicio en la URL.");
        }
});

</script>

</body>
</html>
